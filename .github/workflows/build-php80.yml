name: build-php80

# ============================================================
# 构建 php80 镜像并推送到 GitHub Container Registry (ghcr.io)
#
# 镜像地址：
#   ghcr.io/<你的用户名>/<仓库名>/php80:<PHP版本>   例 ghcr.io/xxx/dnmp/php80:8.5
#   ghcr.io/<你的用户名>/<仓库名>/php80:latest
#   ghcr.io/<你的用户名>/<仓库名>/php80:<PHP版本>-<YYYYMMDD>   每次构建留档
# 想换地址，可在仓库 Variables 里设置 GHCR_IMAGE（例如 abc/php80）
#
# 触发：手动 / 推送到 php80/ / 每周一 02:00(北京时间) 定时
# 版本·扩展·时区·换源 全部在 php80/Dockerfile 顶部“配置区”改
#
# 构建前会比对基础镜像 digest（+ Dockerfile 内容 + 目标平台）：
#   与上次成功构建一致 -> 跳过构建（不拉不推）
#   手动触发时填 force=true 可强制重建
# ============================================================

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '目标平台（留空=linux/amd64），多架构示例：linux/amd64,linux/arm64'
        required: false
        default: ''
      force:
        description: '忽略 digest 比对强制重建：true / false'
        required: false
        default: 'false'
  push:
    branches: [main, master]
    paths:
      - 'php80/**'
      - '.github/workflows/build-php80.yml'
  pull_request:
    paths:
      - 'php80/**'
  schedule:
    # 每周一凌晨 02:00 北京时间（= 周日 18:00 UTC）自动重建一次
    # 注意：GitHub 定时任务在高峰期可能延迟几分钟到半小时才启动
    - cron: '0 18 * * 0'

# 避免定时和手动同时跑
concurrency:
  group: build-php80
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送 ghcr.io 必需
    env:
      PLATFORMS: ${{ inputs.platforms || vars.PHP80_PLATFORMS || 'linux/amd64' }}
      GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}   # 可选，留空则用 ghcr.io/<owner>/<repo>/php80
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验 php80/Dockerfile 并读取配置区
        id: cfg
        run: |
          set -euo pipefail

          # 约定：php80 的所有文件都放在仓库的 php80/ 目录下，不放仓库根目录
          CTX=php80
          [ -f "$CTX/Dockerfile" ] || { echo "ERROR: 找不到 $CTX/Dockerfile（php80 相关文件必须放在 php80/ 目录）"; exit 1; }
          echo "CTX=$CTX" >> "$GITHUB_ENV"

          # 镜像名（GHCR 要求全小写）
          image="${GHCR_IMAGE:-ghcr.io/${GITHUB_REPOSITORY,,}/php80}"
          echo "IMAGE=${image,,}" >> "$GITHUB_ENV"
          echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

          # 从配置区读出 PHP 版本，作为镜像 tag（解析失败则用 rolling，避免与 latest 重复）
          VER="$(sed -n 's|^ARG PHP_VERSION=php:\(.*\)-fpm-alpine$|\1|p' "$CTX/Dockerfile" | head -n 1)"
          echo "PHP_VER=${VER:-rolling}" >> "$GITHUB_ENV"

          if [[ "${PLATFORMS}" == *,* ]]; then
            echo "multi=1" >> "$GITHUB_OUTPUT"
          else
            echo "multi=0" >> "$GITHUB_OUTPUT"
          fi

          echo "构建目录: $CTX"
          echo "镜像地址: ${image,,}"
          echo "PHP 版本: ${VER:-rolling}"
          echo "目标平台: ${PLATFORMS}"

          {
            echo "### php80 镜像构建"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 镜像 | \`${image,,}:${VER:-rolling}\` |"
            echo "| 版本 | ${VER:-rolling} |"
            echo "| 平台 | ${PLATFORMS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          sed -n '/配 置 区/,/配 置 区 结 束/p' "$CTX/Dockerfile"

      - name: 设置 QEMU（多架构）
        if: steps.cfg.outputs.multi == '1'
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- 构建前检查：基础镜像 digest 未变化则跳过 ----------
      - name: 解析基础镜像 digest
        id: base
        run: |
          set -euo pipefail

          # 与 tag 解析保持一致，从配置区读取基础镜像
          BASE="$(sed -n 's|^ARG PHP_VERSION=\(.*\)$|\1|p' "$CTX/Dockerfile" | head -n 1)"
          BASE="${BASE:-php:8.5-fpm-alpine}"

          DIGEST=""
          if RAW="$(docker buildx imagetools inspect "$BASE" --format '{{json .Manifest.Digest}}' 2>/dev/null)"; then
            DIGEST="$(printf '%s' "$RAW" | tr -d '"')"
          fi
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::warning::读取 $BASE 的 digest 失败（网络/限流），本次直接构建"
            DIGEST="unknown-${GITHUB_RUN_ID}"
          fi

          # 状态 key：基础镜像 digest + 目标平台 + Dockerfile 内容
          KEY="$( { printf '%s\n' "$DIGEST" "$PLATFORMS"; cat "$CTX/Dockerfile"; } | sha256sum | cut -c1-20 )"

          {
            echo "BASE_IMAGE=$BASE"
            echo "BASE_DIGEST=$DIGEST"
            echo "STATE_KEY=php80-build-state-${KEY}"
          } >> "$GITHUB_ENV"

          echo "key=php80-build-state-${KEY}" >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "### 基础镜像检查"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 基础镜像 | \`${BASE}\` |"
            echo "| digest | \`${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 读取上次构建状态
        id: state
        uses: actions/cache/restore@v4
        with:
          path: .build-state
          key: ${{ steps.base.outputs.key }}

      - name: 判断是否需要构建
        id: decide
        env:
          FORCE: ${{ inputs.force }}
          HIT: ${{ steps.state.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "${FORCE}" = "true" ]; then
            echo "skip=0" >> "$GITHUB_OUTPUT"
            REASON="force=true，强制重建"
          elif [ "${HIT}" = "true" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            REASON="基础镜像 digest 与 Dockerfile 均未变化 → 跳过构建"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
            REASON="基础镜像或 Dockerfile 有变化 → 开始构建"
          fi
          echo "$REASON"
          echo "- $REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: 登录 GHCR
        if: github.event_name != 'pull_request' && steps.decide.outputs.skip != '1'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        if: steps.decide.outputs.skip != '1'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CTX }}
          file: ${{ env.CTX }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.PHP_VER }}
            ${{ env.IMAGE }}:${{ env.PHP_VER }}-${{ env.DATE }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: 记录本次构建状态
        if: steps.decide.outputs.skip != '1' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p .build-state
          printf 'base=%s\ndigest=%s\nplatforms=%s\nrun=%s\n' \
            "$BASE_IMAGE" "$BASE_DIGEST" "$PLATFORMS" "$GITHUB_RUN_ID" > .build-state/last-build.txt
          cat .build-state/last-build.txt

      - name: 保存构建状态（供下次比对）
        if: steps.decide.outputs.skip != '1' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .build-state
          key: ${{ steps.base.outputs.key }}
