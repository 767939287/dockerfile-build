name: build-rsyslog

# ============================================================
# 构建 rsyslog 镜像并推送到 GitHub Container Registry (ghcr.io)
#
# 镜像地址（GHCR 要求全小写，会自动转小写）：
#   ghcr.io/<用户名>/<仓库名>/rsyslog:latest
#   ghcr.io/<用户名>/<仓库名>/rsyslog:<alpine标签>    例 3.20（Dockerfile 未写标签时用 rolling）
#   ghcr.io/<用户名>/<仓库名>/rsyslog:<YYYYMMDD>      每次构建留档
# 想换地址，可在仓库 Variables 里设置 RSYSLOG_IMAGE（例如 abc/rsyslog）
#
# 触发：手动 / 推送到 rsyslog/ / 每周一 02:00(北京时间) 定时
# ============================================================

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '目标平台（留空=linux/amd64），多架构示例：linux/amd64,linux/arm64'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths:
      - 'rsyslog/**'
      - '.github/workflows/build-rsyslog.yml'
  pull_request:
    paths:
      - 'rsyslog/**'
  schedule:
    # 每周一凌晨 02:00 北京时间（= 周日 18:00 UTC）自动重建一次
    # 注意：GitHub 定时任务在高峰期可能延迟几分钟到半小时才启动
    - cron: '0 18 * * 0'

# 避免定时和手动同时跑同一个镜像
concurrency:
  group: build-rsyslog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送 ghcr.io 必需
    env:
      PLATFORMS: ${{ inputs.platforms || vars.RSYSLOG_PLATFORMS || 'linux/amd64' }}
      GHCR_IMAGE: ${{ vars.RSYSLOG_IMAGE }}   # 可选，留空则用 ghcr.io/<owner>/<repo>/rsyslog
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 定位构建目录并读取基础镜像标签
        id: cfg
        run: |
          set -euo pipefail

          # 兼容两种布局：仓库里有 rsyslog/ 目录，或 Dockerfile 就在仓库根目录
          if [ -f rsyslog/Dockerfile ]; then CTX=rsyslog; else CTX=.; fi
          [ -f "$CTX/Dockerfile" ] || { echo "ERROR: 找不到 $CTX/Dockerfile"; exit 1; }
          echo "CTX=$CTX" >> "$GITHUB_ENV"

          # 镜像名（GHCR 要求全小写）
          image="${GHCR_IMAGE:-ghcr.io/${GITHUB_REPOSITORY,,}/rsyslog}"
          echo "IMAGE=${image,,}" >> "$GITHUB_ENV"
          echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

          # 从 FROM 行取 alpine 标签（FROM alpine:3.20 -> 3.20）
          # 若未写标签则跟随 alpine:latest，此时版本 tag 用 rolling，避免和 latest 重复
          BASE_TAG="$(sed -n 's/^FROM[[:space:]]\{1,\}alpine:\([0-9][^[:space:]]*\).*/\1/p' "$CTX/Dockerfile" | head -n 1)"
          if [ -n "$BASE_TAG" ]; then
            VER_TAG="$BASE_TAG"
          else
            BASE_TAG=latest
            VER_TAG=rolling
          fi
          echo "BASE_TAG=${BASE_TAG}" >> "$GITHUB_ENV"
          echo "VER_TAG=${VER_TAG}" >> "$GITHUB_ENV"

          if [[ "${PLATFORMS}" == *,* ]]; then
            echo "multi=1" >> "$GITHUB_OUTPUT"
          else
            echo "multi=0" >> "$GITHUB_OUTPUT"
          fi

          echo "构建目录: $CTX"
          echo "镜像地址: ${image,,}"
          echo "基础镜像: alpine:${BASE_TAG}"
          echo "版本 tag: ${VER_TAG}"
          echo "目标平台: ${PLATFORMS}"

          {
            echo "### rsyslog 镜像构建"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 镜像 | \`${image,,}:${VER_TAG}\` |"
            echo "| 基础镜像 | \`alpine:${BASE_TAG}\` |"
            echo "| 平台 | ${PLATFORMS} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 设置 QEMU（多架构）
        if: steps.cfg.outputs.multi == '1'
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CTX }}
          file: ${{ env.CTX }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VER_TAG }}
            ${{ env.IMAGE }}:${{ env.DATE }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
